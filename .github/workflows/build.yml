name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*beta*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache web dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: web-

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  # 静态单文件二进制：musl 全静态，无动态库依赖
  static:
    name: Static (${{ matrix.target }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            archive: tar.gz
          - target: armv7-unknown-linux-musleabihf
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: static-${{ matrix.target }}

      - name: Install musl and cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          sudo dpkg --add-architecture armhf
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build server (static single file)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo build --release -p rscross-server --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/rscross-server || true

      - name: Verify static linkage
        run: |
          BIN=target/${{ matrix.target }}/release/rscross-server
          if file "$BIN" | grep -q "dynamically linked"; then
            echo "::error::二进制仍为动态链接"
            file "$BIN"
            exit 1
          fi
          ls -lh "$BIN"

      - name: Package
        run: |
          set -euo pipefail
          TARGET=${{ matrix.target }}
          BIN=target/$TARGET/release/rscross-server
          STAGE="rscross-server-$TARGET"
          mkdir -p dist
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/rscross-server"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          cp -r configs "$STAGE/" 2>/dev/null || true
          cd dist
          tar -czf "$STAGE.tar.gz" "$STAGE"
          rm -rf "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rscross-server-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: dist/*.tar.gz

  # 客户端：Linux 全静态 + Windows 独立 exe
  client:
    name: Client (${{ matrix.target }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            ext: ''
          - target: aarch64-unknown-linux-musl
            ext: ''
          - target: armv7-unknown-linux-musleabihf
            ext: ''
          - target: x86_64-pc-windows-msvc
            ext: .exe
          - target: aarch64-pc-windows-msvc
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}

      - name: Install cross tools
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          sudo dpkg --add-architecture armhf
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build client
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'linux') && '-C target-feature=+crt-static' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo build --release -p rscross-client --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/rscross-client${{ matrix.ext }} || true

      - name: Package
        run: |
          set -euo pipefail
          TARGET=${{ matrix.target }}
          EXT="${{ matrix.ext }}"
          BIN=target/$TARGET/release/rscross-client$EXT
          STAGE="rscross-client-$TARGET"
          mkdir -p dist
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/rscross-client$EXT"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          cp -r configs "$STAGE/" 2>/dev/null || true
          cd dist
          tar -czf "$STAGE.tar.gz" "$STAGE"
          if [ -n "$EXT" ]; then
            zip -q -r "$STAGE.zip" "$STAGE"
          fi
          rm -rf "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rscross-client-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
