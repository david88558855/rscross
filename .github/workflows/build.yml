name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*beta*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache web dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: web-

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (check only)
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Build frontend
        working-directory: ./web
        run: npm run build

  server:
    name: Server (${{ matrix.target }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}

      - name: Cache web dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: web-

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Embed web assets
        run: ./scripts/embed-web.sh

      - name: Cross build server
        run: |
          cargo build \
            --release \
            -p rscross-server \
            --target ${{ matrix.target }}

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/rscross-server
          STAGE=dist/server-${{ matrix.target }}
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp -r server/configs "$STAGE/" 2>/dev/null || true
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          cd dist
          tar -czf "rscross-server-${{ matrix.target }}.tar.gz" "server-${{ matrix.target }}"
          rm -rf "server-${{ matrix.target }}"
          echo "asset=rscross-server-${{ matrix.target }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rscross-server-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: dist/*.tar.gz

  client:
    name: Client (${{ matrix.target }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}

      - name: Cross build client
        run: |
          cargo build \
            --release \
            -p rscross-client \
            --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          TARGET=${{ matrix.target }}
          EXT=""
          case "$TARGET" in
            *windows*) EXT=".exe" ;;
          esac
          BIN=target/$TARGET/release/rscross-client$EXT
          STAGE=dist/client-$TARGET
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/rscross-client$EXT"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          cd dist
          tar -czf "rscross-client-$TARGET.tar.gz" "client-$TARGET"
          rm -rf "client-$TARGET"
          zip -q -r "rscross-client-$TARGET.zip" "client-$TARGET"
          rm -rf "client-$TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rscross-client-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip

  docker:
    name: Docker
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Embed web assets
        run: ./scripts/embed-web.sh

      - name: Extract Tag
        id: extract_tag
        run: |
          TAG_NAME=$(echo "${{ github.ref }}" | sed 's|refs/tags/||')
          echo "TAG=${TAG_NAME:-latest}" >> $GITHUB_ENV

      - name: Docker buildx server
        if: secrets.DOCKER_USERNAME != ''
        run: |
          docker buildx create --name rscross-builder --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f docker/Dockerfile.server \
            -t ${{ vars.DOCKER_IMAGE_SERVER || 'david88558855/rscross-server' }}:latest \
            -t ${{ vars.DOCKER_IMAGE_SERVER || 'david88558855/rscross-server' }}:${{ env.TAG }} \
            --push .
          docker buildx rm rscross-builder

      - name: Docker buildx client
        if: secrets.DOCKER_USERNAME != ''
        run: |
          docker buildx create --name rscross-client-builder --use
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            -f docker/Dockerfile.client \
            -t ${{ vars.DOCKER_IMAGE_CLIENT || 'david88558855/rscross-client' }}:latest \
            -t ${{ vars.DOCKER_IMAGE_CLIENT || 'david88558855/rscross-client' }}:${{ env.TAG }} \
            --push .
          docker buildx rm rscross-client-builder

      - name: Cleanup Rust cache
        if: always()
        run: rm -rf ./target
