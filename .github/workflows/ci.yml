name: ci

# 本仓库禁止本地编译：所有验证都在这里完成。
# 顺序刻意设计为 fmt → check → (test | clippy | musl build) → e2e，
# 让语法/类型错误在第一层就暴露，而不是等两个平台的交叉编译跑完。

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    # 首轮允许失败：格式噪音不应掩盖真正的编译错误。稳定后改为门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 检查格式（不 gate；差异打成 patch 工件便于直接应用）
        run: |
          set +e
          cargo fmt --all
          if git diff --quiet; then
            echo "✅ 格式无差异"
            git diff > rustfmt.patch
            exit 0
          fi
          echo "::warning::存在未格式化的文件；已生成 rustfmt.patch 工件"
          git --no-pager diff --stat
          # 用 LF 生成补丁，避免 Windows 上 checkout 成 CRLF 后无法 git apply
          git -c core.autocrlf=false diff > rustfmt.patch
          exit 1
      - name: 上传 rustfmt 补丁
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt.patch
          path: rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets
      - name: 上传生成的 Cargo.lock（供提交以固定依赖）
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: warn
          retention-days: 7

  test:
    name: cargo test
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rscross-common
          - rscross-config
          - rscross-store
          - rscross-auth
          - rscross-transport
          - rscross-control
          - rscross-server
          - rscross-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 逐 crate 跑并加硬超时：出现死锁时能立刻定位到具体 crate，
      # 而不是挂满 6 小时才失败。--nocapture --test-threads=1 让日志里
      # 最后一条就是卡住的那个用例。
      - name: cargo test -p ${{ matrix.crate }}
        run: timeout -k 10 600 cargo test -p ${{ matrix.crate }} -- --nocapture --test-threads=1

  clippy:
    name: cargo clippy
    needs: check
    runs-on: ubuntu-latest
    # 与 fmt 同理：首轮不阻断，避免风格项淹没真实错误。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  build-musl:
    name: musl ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}
      - name: 安装 cross（容器化交叉编译，容器内自带 musl 工具链）
        uses: taiki-e/install-action@cross
      - name: 交叉编译（静态、无动态依赖）
        run: |
          cross build --release --target ${{ matrix.target }} \
            --bin rscross-console --bin rscross-server --bin rscross-client
      - name: 收集产物（平台无关检查）
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          file "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client"
          ls -lh "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client"
          mkdir -p dist
          cp "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client" dist/
          echo "注意：交叉产物不能在本机直接执行，冒烟放在下面的目标专属步骤里做。"
      - name: 静态链接断言（x86_64 本机可直接验证）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          for bin in rscross-console rscross-server rscross-client; do
            if ldd "dist/$bin" 2>&1 | grep -q "not a dynamic executable"; then
              echo "✅ $bin 静态链接"
            elif ldd "dist/$bin" 2>&1 | grep -q "statically linked"; then
              echo "✅ $bin 静态链接"
            else
              echo "❌ $bin 仍是动态可执行文件："
              ldd "dist/$bin"
              exit 1
            fi
            "./dist/$bin" --version
            "./dist/$bin" --print-default-config > /dev/null
          done
      - name: 静态链接断言（aarch64 用 qemu 交叉验证）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          for bin in rscross-console rscross-server rscross-client; do
            qemu-aarch64-static "dist/$bin" --version
            qemu-aarch64-static "dist/$bin" --print-default-config > /dev/null
          done
          echo "✅ aarch64 musl 产物在 qemu 下可执行"
      - uses: actions/upload-artifact@v4
        with:
          name: rscross-${{ matrix.target }}
          path: dist/rscross-*
          retention-days: 14

  # Windows 版：让本地机器上能直接跑起来，把「浏览器打不开控制台」里的网络因素
  # （云安全组 / 服务器防火墙 / 跨机可达性）一次性排除掉。
  # 本仓库禁止本地编译，所以这个产物同样只在这里产出。
  build-windows:
    name: windows x86_64-msvc
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-msvc
      - name: 构建（原生 MSVC；rusqlite 用 bundled，由 runner 自带的 cl.exe 编译）
        run: >
          cargo build --release --target x86_64-pc-windows-msvc
          --bin rscross-console --bin rscross-server --bin rscross-client
      - name: 冒烟一：--version / --print-default-config / --check（含内嵌前端自检）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target/x86_64-pc-windows-msvc/release"
          foreach ($bin in @("rscross-console", "rscross-server", "rscross-client")) {
            $exe = Join-Path $out "$bin.exe"
            if (-not (Test-Path $exe)) { throw "缺少产物: $exe" }
            & $exe --version
            & $exe --print-default-config | Out-Null
          }
          $cfg = Join-Path $env:RUNNER_TEMP "smoke-server.toml"
          $state = Join-Path $env:RUNNER_TEMP "smoke-state"
          # `--check` 会打印内嵌前端自检结论，是「页面在不在二进制里」的直接证据
          & (Join-Path $out "rscross-server.exe") --check --config $cfg --state-dir $state
      # 逻辑放在脚本文件里：变量名 `$home` 曾撞上 PowerShell 只读自动变量，
      # 把「服务已就绪」误报成失败。独立文件也便于本地复现。
      - name: 冒烟二：真实启动并验证控制台页面（tests/e2e/smoke-windows.ps1）
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/e2e/smoke-windows.ps1 -Dist "target/x86_64-pc-windows-msvc/release" -Port 7800
      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/rscross-*.exe" dist/
          Get-ChildItem dist | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: rscross-x86_64-pc-windows-msvc
          path: dist/rscross-*.exe
          retention-days: 14

  e2e:
    name: end to end
    needs: build-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rscross-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/rscross-console dist/rscross-server dist/rscross-client
      - name: 两种部署形态全链路（单机内嵌 / 多节点汇聚）
        run: python3 tests/e2e/e2e.py dist
