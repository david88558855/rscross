name: ci

# 本仓库禁止本地编译：所有验证都在这里完成。
# 顺序刻意设计为 fmt → check → (test | clippy | musl build) → e2e，
# 让语法/类型错误在第一层就暴露，而不是等两个平台的交叉编译跑完。

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    # 首轮允许失败：格式噪音不应掩盖真正的编译错误。稳定后改为门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 检查格式（本 job 不 gate；失败时打印可照抄的 diff）
        run: |
          set +e
          cargo fmt --all
          if git diff --quiet; then
            echo "✅ 格式无差异"
            exit 0
          fi
          echo "::warning::存在未格式化的文件，下面是对应的 rustfmt 结果"
          git --no-pager diff
          exit 1

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets
      - name: 上传生成的 Cargo.lock（供提交以固定依赖）
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: warn
          retention-days: 7

  test:
    name: cargo test
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rscross-common
          - rscross-config
          - rscross-store
          - rscross-auth
          - rscross-transport
          - rscross-control
          - rscross-server
          - rscross-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 逐 crate 跑并加硬超时：出现死锁时能立刻定位到具体 crate，
      # 而不是挂满 6 小时才失败。--nocapture --test-threads=1 让日志里
      # 最后一条就是卡住的那个用例。
      - name: cargo test -p ${{ matrix.crate }}
        run: timeout -k 10 600 cargo test -p ${{ matrix.crate }} -- --nocapture --test-threads=1

  clippy:
    name: cargo clippy
    needs: check
    runs-on: ubuntu-latest
    # 与 fmt 同理：首轮不阻断，避免风格项淹没真实错误。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  build-musl:
    name: musl ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}
      - name: 安装 cross（容器化交叉编译，容器内自带 musl 工具链）
        uses: taiki-e/install-action@cross
      - name: 交叉编译（静态、无动态依赖）
        run: |
          cross build --release --target ${{ matrix.target }} \
            --bin rscross-console --bin rscross-server --bin rscross-client
      - name: 收集产物（平台无关检查）
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          file "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client"
          ls -lh "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client"
          mkdir -p dist
          cp "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client" dist/
          echo "注意：交叉产物不能在本机直接执行，冒烟放在下面的目标专属步骤里做。"
      - name: 静态链接断言（x86_64 本机可直接验证）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          for bin in rscross-console rscross-server rscross-client; do
            if ldd "dist/$bin" 2>&1 | grep -q "not a dynamic executable"; then
              echo "✅ $bin 静态链接"
            elif ldd "dist/$bin" 2>&1 | grep -q "statically linked"; then
              echo "✅ $bin 静态链接"
            else
              echo "❌ $bin 仍是动态可执行文件："
              ldd "dist/$bin"
              exit 1
            fi
            "./dist/$bin" --version
            "./dist/$bin" --print-default-config > /dev/null
          done
      - name: 静态链接断言（aarch64 用 qemu 交叉验证）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          for bin in rscross-console rscross-server rscross-client; do
            qemu-aarch64-static "dist/$bin" --version
            qemu-aarch64-static "dist/$bin" --print-default-config > /dev/null
          done
          echo "✅ aarch64 musl 产物在 qemu 下可执行"
      - uses: actions/upload-artifact@v4
        with:
          name: rscross-${{ matrix.target }}
          path: dist/rscross-*
          retention-days: 14

  e2e:
    name: end to end
    needs: build-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rscross-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/rscross-console dist/rscross-server dist/rscross-client
      - name: 两种部署形态全链路（单机内嵌 / 多节点汇聚）
        run: python3 tests/e2e/e2e.py dist
