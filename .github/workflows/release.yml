name: release

# 发版流程（不要在分支推送上期望它跑）：
#   1) 先改 Cargo.toml 的 version 并推到 main，等 CI 全绿 —— 这一条是门禁，
#      main 红着打 tag 只会多烧一轮；
#   2) git tag -a v0.1.6 -F tag_msg.txt && git push origin v0.1.6
#      tag 注解的**正文**会原样成为 Release 说明（见下方 publish job 的
#      `%(contents:body)`），所以发布说明只写这一处，不要另立副本。
# 产物：① 两个 musl 静态二进制 × 两个架构（tar.gz）
#       ② Windows x86_64 二进制（zip，本机可直接双击/命令行运行）
#       ③ 各自的 sha256 校验和

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的 tag（须与 Cargo.toml 的 version 一致，例如 v0.1.6）"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARIES: rscross-console rscross-server rscross-client

jobs:
  # 打 tag 前先确认版本号对得上。
  #
  # 曾经出现过 crate 版本停在 0.1.0、而 tag 已经是 v0.1.1 的情况：
  # 用户下载 v0.1.1 的包，`--version` 却报 0.1.0，根本没法确认装的是哪个版本。
  # 这类漂移必须在**发布前**拦下，而不是等用户发现。
  guard:
    name: 校验 tag 与版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag 必须与 Cargo.toml 的 version 一致
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          crate="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          echo "tag=$tag  Cargo.toml=$crate"
          if [ "v$crate" != "$tag" ]; then
            echo "::error::tag ($tag) 与 Cargo.toml 的版本 (v$crate) 不一致；请先把 Cargo.toml 的 version 改成 $tag 再打 tag"
            exit 1
          fi

  build:
    needs: guard
    name: musl ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@cross

      - name: 交叉编译
        run: |
          cross build --release --target ${{ matrix.target }} \
            --bin rscross-console --bin rscross-server --bin rscross-client

      - name: 打包与校验和
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="rscross-${REF}-${{ matrix.target }}"
          mkdir -p "stage/$NAME"
          OUT="target/${{ matrix.target }}/release"
          cp "$OUT/rscross-console" "$OUT/rscross-server" "$OUT/rscross-client" "stage/$NAME/"
          cp README.md LICENSE "stage/$NAME/" 2>/dev/null || true
          mkdir -p dist
          tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"
          ( cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
          ls -lh dist/

      - name: 静态链接断言
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            for bin in rscross-console rscross-server rscross-client; do
              ldd "$OUT/$bin" 2>&1 | grep -Eq "not a dynamic executable|statically linked"
              "$OUT/$bin" --version
            done
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
            for bin in rscross-console rscross-server rscross-client; do
              qemu-aarch64-static "$OUT/$bin" --version
            done
          fi
          echo "✅ ${{ matrix.target }} 静态产物可用"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  build-windows:
    needs: guard
    name: windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: 构建
        run: >
          cargo build --release --target ${{ matrix.target }}
          --bin rscross-console --bin rscross-server --bin rscross-client

      - name: 打包与校验和
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ref = "${{ github.event.inputs.tag || github.ref_name }}"
          $name = "rscross-$ref-${{ matrix.target }}"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          $out = "target/${{ matrix.target }}/release"
          Copy-Item "$out/rscross-*.exe" $stage
          Copy-Item README.md, LICENSE $stage -ErrorAction SilentlyContinue
          # 顶层目录名即 $name，与 Linux 侧的 tar.gz 结构保持一致
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # 校验和文件必须写 **LF** 行尾。
          #
          # `"..." | Out-File` 在 Windows 上写出来是 CRLF，于是 Linux / macOS
          # 侧 `sha256sum -c x.zip.sha256` 会报
          #   sha256sum: 'x.zip'$'\r': No such file or directory
          #   FAILED open or read
          # —— 哈希值本身是对的，坑只在行尾（v0.1.5 实测踩到）。
          # 三平台产物的校验和格式必须一致，所以这里显式指定。
          Set-Content -NoNewline -Encoding ascii "dist/$name.zip.sha256" "$hash  $name.zip`n"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      - name: 冒烟（产物来自本次构建，非开发目录）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target/${{ matrix.target }}/release"
          foreach ($bin in @("rscross-console", "rscross-server", "rscross-client")) {
            & (Join-Path $out "$bin.exe") --version
          }
          # 真实启动一次，确认发布包里的页面确实能打开
          pwsh -NoProfile -File ./tests/e2e/smoke-windows.ps1 -Dist $out -Port 7800

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    name: 创建 Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成发布说明（tag 注解正文 + 产物清单）
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"

          # 不要直接写 `git tag -l --format='%(contents:body)' "$REF"`。
          #
          # actions/checkout 在 checkout 阶段会额外跑一次
          #   git fetch --no-tags origin "+<commit-sha>:refs/tags/$REF"
          # 把本地那个**注解 tag 覆盖成指向 commit 的轻量引用**，于是
          # %(contents:body) 解析到的是**提交信息**，发布说明里会混进一段
          # 与本次发布无关的 commit body。v0.1.5 就这么翻过一次车。
          #
          # 这里按 refspec 重新拉一次注解对象，落到独立 ref 上：既拿到真正的
          # tag 正文，也不与 checkout 留下的引用互相覆盖。
          git fetch --force --no-tags --quiet origin \
            "+refs/tags/$REF:refs/tags/rscross-notes-src"
          objtype="$(git for-each-ref --format='%(objecttype)' refs/tags/rscross-notes-src)"
          if [ "$objtype" != "tag" ]; then
            echo "::error::$REF 在本地不是注解 tag（objecttype=$objtype）—— 发布说明会取到 commit 信息而不是 tag 正文，已中止"
            exit 1
          fi
          git for-each-ref --format='%(contents:body)' refs/tags/rscross-notes-src > notes.md

          # 只有标题、没有正文的 tag 是允许的（`git tag -a vX -m "..."`），
          # 但要说清楚，别让人以为正文丢了。
          if [ ! -s notes.md ]; then
            echo "::warning::tag $REF 没有注解正文，发布说明将只有产物清单"
            echo "rscross $REF" > notes.md
          fi
          {
            echo
            echo "## 产物"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            for f in artifacts/*.tar.gz artifacts/*.zip; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                *.tar.gz) desc="Linux musl 静态二进制（console + server + client，无动态依赖）" ;;
                *.zip)    desc="Windows x86_64 二进制（console + server + client，.exe）" ;;
                *)        desc="产物" ;;
              esac
              echo "| \`$base\` | $desc |"
            done
            echo
            echo "### 校验"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
            echo
            echo "### 快速开始"
            echo '```bash'
            echo "# 方式 B：单机自用（服务端内嵌控制台）"
            echo "./rscross-server --embedded --config rscross-server.toml"
            echo "# 客户端直连这台服务端的控制台（令牌在「客户端管理」页签发）"
            echo "./rscross-client --console http://<服务端IP>:7800 \\"
            echo "    --name node-1 --enroll-token <令牌>"
            echo
            echo "# 方式 A：多节点汇聚（独立控制台 + N 台服务端节点）"
            echo "./rscross-console --config rscross-console.toml"
            echo "#      在控制台「服务端节点」页创建节点，复制命令到公网机器执行："
            echo "./rscross-server --managed --console http://<控制台IP>:7800 \\"
            echo "    --name node-1 --enroll-token <节点令牌>"
            echo
            echo "# Windows：解压后在 PowerShell 里本机自测"
            echo ".\rscross-server.exe --embedded"
            echo "#      浏览器打开 http://127.0.0.1:7800 ，首次密码打印在启动日志里"
            echo '```'
          } >> notes.md
          ls -lh artifacts/

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: artifacts/*
          draft: false
          prerelease: false
