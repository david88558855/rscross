[workspace]
resolver = "2"
members = [
    "crates/rscross-common",
    "crates/rscross-config",
    "crates/rscross-store",
    "crates/rscross-auth",
    "crates/rscross-transport",
    "crates/rscross-control",
    "crates/rscross-console",
    "crates/rscross-server",
    "crates/rscross-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/david88558855/rscross"
homepage = "https://github.com/david88558855/rscross"

[workspace.dependencies]
# --- 自身 crate ---
rscross-common = { path = "crates/rscross-common" }
rscross-config = { path = "crates/rscross-config" }
rscross-store = { path = "crates/rscross-store" }
rscross-auth = { path = "crates/rscross-auth" }
rscross-transport = { path = "crates/rscross-transport" }
rscross-control = { path = "crates/rscross-control" }

# --- 传输层核心依赖（要求 1）---
# Iroh: QUIC + NAT 打洞 + Relay 回退 + 公钥身份/密钥交换 + 地址发现
iroh = "1.3"
# FerroTunnel: 反向隧道 + 流多路复用 + HTTP/gRPC/WS/TCP 承载 + 限速/可观测
ferrotunnel = "1.5"

# --- 运行时 / 异步 ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"

# --- Web / 序列化 ---
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# --- 存储 / 鉴权 ---
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# --- CLI / 日志 / 错误 ---
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
