# rscross 服务端配置
address: ":8080"
mode: "prod"
log_level: "info"

# 数据库：sqlite 或 mysql
db_type: "sqlite"
sqlite_path: "data/rscross.db"

# MySQL 连接串（db_type=mysql 时必填）
# mysql_dsn: "user:pass@tcp(127.0.0.1:3306)/rscross"

# 生产环境必须配置，用于签发登录令牌
# 建议：openssl rand -hex 32
jwt_secret: ""

# 路径前缀，默认为空
base_path: ""

allow_register: false
enable_gzip: true
