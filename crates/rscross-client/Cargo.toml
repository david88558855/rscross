[package]
name = "rscross-client"
description = "rscross 客户端：反向隧道接入 + Iroh 直连服务 + 控制面心跳"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rscross_client"
path = "src/lib.rs"

[[bin]]
name = "rscross-client"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { workspace = true }
hickory-resolver = { workspace = true }
# 直接用 RData::TXT 取原始字节 —— Record 的 Display 是 RFC 1033 的完整记录格式
hickory-proto = { version = "0.26" }

rscross-common = { workspace = true, features = ["runtime"] }
rscross-config = { workspace = true }
rscross-transport = { workspace = true }

reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
