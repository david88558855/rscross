[package]
name = "rscross-common"
description = "rscross 共享类型、错误与常量"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# 仅 `runtime` feature 需要：跨平台「等待关停信号」。
# 做成可选是为了让 common 的默认形态保持轻量 —— 不需要信号的调用方
# （config / store / auth / transport）不必被迫拉进 tokio 的 signal。
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
# 等待进程关停信号（control 与 client 用）。
runtime = ["dep:tokio", "dep:tracing"]
