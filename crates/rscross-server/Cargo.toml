[package]
name = "rscross-server"
description = "rscross 服务端节点：反向隧道中继 + Iroh 节点；可单机内嵌控制台，也可加入独立控制台"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rscross_server"
path = "src/lib.rs"

[[bin]]
name = "rscross-server"
path = "src/main.rs"

[dependencies]
rscross-common = { workspace = true }
rscross-config = { workspace = true }
rscross-transport = { workspace = true }
# http-client：managed 模式需要向远端控制台注册
rscross-control = { workspace = true, features = ["http-client"] }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
